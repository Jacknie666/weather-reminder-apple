name: Daily Weather Reminder (CST 08/12/16/20)

on:
  schedule:
    # 北京时间 (CST = UTC+8)，每4小时执行一次，从08:00开始
    # 08:00 CST = 00:00 UTC
    # 12:00 CST = 04:00 UTC
    # 16:00 CST = 08:00 UTC
    # 20:00 CST = 12:00 UTC  ← 触发次日概况
    - cron: '0 0,4,8,12 * * *'
  workflow_dispatch: # 允许手动运行

jobs:
  run-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weather Bot
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python umbrella_reminder.py
